<html>
    <head>
        <title>grid experiment</title>
        <link rel="stylesheet" href=
"https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/css/bootstrap.min.css">
    <script src=
"https://maxcdn.bootstrapcdn.com/bootstrap/4.3.1/js/bootstrap.min.js">
    </script>
    </head>
    <body>
        <div class="container">
            <h1>Hello Students!</h1>
            <p>Resize the browser window to see the effect.</p>
            <div class="row">
                <!--Size medium and extra small-->
                <div class="col-md-8 col-xs-4" style="background-color:red; border: 1px solid black;">xs</div>
                <div class="col-md-12 col-md-5" style="background-color: lavender;">.col-xs-3</div>
            </div>
             <div class="row">
                <!--Size large,meduim and extra small-->
                <div class="col-md-12 col-lg-6" style="background-color: lavenderblush">.col-xs-6</div>
                <div class="col-xs-6-col-md-2" style="background-color: lightgrey;">.col-xs-6</div>
            </div>
            <div class="row" style="background-color: lightcyan;">
                <!--Size extra small-->
                <div class="col-xs-6">.col-xs-6</div>
                <div class="col-xs-6">.col-xs-6</div>
            </div>
        </div>   
        <div class="container-fluid">
            <h1>large Grids</h1>
            <p>Gummy data</p>
            <p>Resize the browser window to see the effect.</p>
            <div class="row">
            <div class="col-lg-4" style="background-color: yellow;"> dummy</div>
            <div class="col-lg-8" style="background-color:pink;"> dummy</div>
            </div>
        </div> 
    </div>
    </body>
</html>
